fragment AdventureFields on Adventure {
  id
  location
  seed
  startedAt
  version
  caravan {
    destination
    staying
    cargo {
      amount
      material
    }
    riders {
      heroId
      name
    }
  }
  job {
    id
    description
    name
  }
  snapshot {
    jobId
    version
    heroes {
      heroId
      level
      name
      spriteSet
      unitType
      stats {
        damage
        maxHealth
        speed
        traits {
          level
          trait
        }
      }
    }
  }
}
