fragment AdventureFields on Adventure {
  id
  location
  seed
  startedAt
  version
  job {
    id
    description
    name
  }
  snapshot {
    jobId
    version
    heroes {
      heroId
      level
      name
      spriteSet
      unitType
      stats {
        damage
        maxHealth
        speed
        gather {
          material
          rating
        }
      }
    }
  }
}
