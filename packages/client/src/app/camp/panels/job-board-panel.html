<div class="title">
  <h2 id="panel-title">Job board</h2>
  <heat-more-menu id="board-more" [items]="more" />
</div>
<p>{{ description }}</p>
@if (game.adventure(); as adventure) {
  <p class="note">An adventure is under way.</p>
  <a class="link" routerLink="/adventure">{{ adventure.job.name }}</a>
}
<heat-job-list [jobs]="jobs()" />
