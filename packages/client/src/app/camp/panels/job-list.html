@if (jobs().length > 0) {
  <ul class="jobs" aria-label="Jobs">
    @for (job of jobs(); track job.id) {
      @let lock = locked(job);
      <li [class.locked]="lock !== null">
        <a class="link" [routerLink]="['jobs', job.id]">{{ job.name }}</a>
        @if (lock) {
          <span>{{ lock }}</span>
        } @else {
          <span class="pays">
            @for (reward of job.pay; track reward.material) {
              <heat-resource-chip [material]="reward.material" [amount]="reward.amount" />
            } @empty {
              <span>{{ noPay }}</span>
            }
            <span>{{ bonus(job) }}</span>
          </span>
        }
      </li>
    }
  </ul>
} @else {
  <p>No jobs are posted here.</p>
}
