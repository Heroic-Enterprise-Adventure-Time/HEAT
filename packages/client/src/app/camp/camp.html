<section class="camp" [class.side]="side()" [class.labels]="labels()">
  <div #stage class="stage region" [style.height.px]="stageHeight()"></div>

  <nav class="menu" aria-label="Facilities" [class.region]="side()">
    @for (facility of state.facilities(); track facility.kind) {
      <a
        #entry="routerLinkActive"
        class="entry"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [class.unbuilt]="facility.level === 0"
        [routerLink]="['/camp', location(), facility.kind]"
        [attr.title]="labels() ? null : facility.name"
      >
        @if (icons.src(facility.kind); as icon) {
          <img alt="" [ngSrc]="icon" [width]="iconPx()" [height]="iconPx()" />
        }
        <span class="label" [class.narrow-hidden]="!entry.isActive">{{ facility.name }}</span>
      </a>
    }
    @if (game.adventure()) {
      <a class="entry" routerLink="/adventure" [attr.title]="labels() ? null : 'Adventure'">
        @if (icons.src('adventure'); as icon) {
          <img alt="" [ngSrc]="icon" [width]="iconPx()" [height]="iconPx()" />
        }
        <span class="label narrow-hidden">Adventure</span>
      </a>
    }
  </nav>

  <aside class="panel region" aria-labelledby="panel-title">
    <router-outlet />
  </aside>

  @if (game.error(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }
</section>
