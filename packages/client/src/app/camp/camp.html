<section class="camp" [class.side]="side()" [class.labels]="labels()">
  <div #stage class="stage" [style.height.px]="stageHeight()"></div>

  <nav class="menu" aria-label="Facilities">
    @for (facility of state.facilities(); track facility.kind) {
      <a
        class="entry"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [class.unbuilt]="facility.level === 0"
        [routerLink]="['/camp', location(), facility.kind]"
        [attr.title]="labels() ? null : facility.name"
      >
        <img alt="" [ngSrc]="`art/icons/${facility.kind}.png`" [width]="iconPx()" [height]="iconPx()" />
        <span class="label">{{ facility.name }}</span>
      </a>
    }
    @if (game.adventure()) {
      <a class="entry" routerLink="/adventure" [attr.title]="labels() ? null : 'Adventure'">
        <img ngSrc="art/icons/adventure.png" alt="" [width]="iconPx()" [height]="iconPx()" />
        <span class="label">Adventure</span>
      </a>
    }
  </nav>

  <aside class="panel" aria-labelledby="panel-title">
    <router-outlet />
  </aside>

  @if (game.error(); as error) {
    <p class="error">{{ error }}</p>
  }
</section>
