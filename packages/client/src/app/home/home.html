@if (!session.user()) {
  <main>
    <h1>HEAT</h1>
    <p>Heroic Enterprise Adventure Time: a browser game about running an adventuring business.</p>

    @if (config.error(); as error) {
      <p class="error">The page could not load its stack configuration: {{ error }}.</p>
    } @else {
      <button type="button" (click)="session.signIn()">{{ session.signInLabel }}</button>
    }

    @if (session.error(); as error) {
      <p class="error">{{ error }}</p>
    }
  </main>
}
