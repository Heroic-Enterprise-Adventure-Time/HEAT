"""
An adventure as the hub issued it: what the client needs to play it with the seed, and once settled its result and its timeline.
"""
type Adventure {
  id: ID!
  job: Job!

  """The location's id in the static content."""
  location: ID!
  result: AdventureResult
  seed: String!
  snapshot: Snapshot!
  startedAt: DateTime!
  status: AdventureStatus!

  """
  The timeline the hub's replay wrote at settlement, the engine's AdventureTimeline, display only: any version of the client plays it. Null until the adventure is settled.
  """
  timeline: JSON

  """
  The deploy that issued the adventure, and the only one that verifies it.
  """
  version: String!
}

"""
The adventure was discarded: no deploy could verify it, and nothing was credited.
"""
type AdventureDiscarded implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!
}

"""The player's one adventure is open (decision 0003)."""
type AdventureOpen implements Error {
  """The open one, which the client reads from me.openAdventure."""
  adventureId: ID!

  """In the player's words; the client may show it as it is."""
  message: String!
}

"""
How an adventure ended, the engine's `AdventureOutcome`: complete; retreat, ordered or forced by a time limit; defeat, the whole party down.
"""
enum AdventureOutcome {
  COMPLETE
  DEFEAT
  RETREAT
}

"""
What the hub's replay found and settlement wrote: how each stage ended, the rewards, what the warehouse took and what its cap lost, and each hero's XP and fate.
"""
type AdventureResult {
  """What went into the warehouse."""
  credited: [Reward!]!
  endedAtMs: Int!
  heroes: [HeroOutcome!]!

  """What the warehouse's cap turned away."""
  lost: [Reward!]!
  outcome: AdventureOutcome!
  reachedStage: Int!

  """What the run yielded."""
  rewards: [Reward!]!
  stages: [StageResult!]!
}

"""The adventure is settled, so it cannot be discarded."""
type AdventureSettled implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!
}

"""
Open while the player plays it; settled once the hub verified it and paid out; discarded when no deploy could verify it any more.
"""
enum AdventureStatus {
  DISCARDED
  OPEN
  SETTLED
}

"""
The adventure can still be submitted, so it is not discarded: a player who dislikes how a run is going finishes it.
"""
type AdventureVerifiable implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!

  """The version that issued the adventure and still verifies it."""
  version: String!
}

"""Which facility to build at which camp, and the level being built."""
input BuildFacilityInput {
  """One of the camp's own facilities."""
  kind: FacilityKind!

  """
  The level being built: the next one. A level already built answers the camp and charges nothing.
  """
  level: PositiveInt!

  """The camp's location."""
  location: ID!
}

"""
What buildFacility answers: BuildFacilitySuccess, or one of the refusals the union lists, each an Error.
"""
union BuildFacilityResult = BuildFacilitySuccess | Conflict | InsufficientResources | MaxLevel | Requires

"""The mutation did its work: the camp with the level built."""
type BuildFacilitySuccess {
  camp: Camp!
}

"""
One player's view of one location: their facilities, resources and heroes there.
"""
type Camp {
  """Living and dead heroes; retired ones are not active."""
  activeHeroes: Int!

  """
  Each of the camp's own facilities, those every camp has and those it may build, with its level: 0 for one not built.
  """
  facilities: [FacilityLevel!]!
  hallLevel: Int!

  """Active heroes the heroes hall holds at its level."""
  heroCapacity: Int!
  holdings: [Holding!]!
  livingHeroes: Int!

  """The location's id in the static content."""
  location: ID!
  name: String!

  """Stock of each resource the warehouse holds at its level."""
  resourceCapacity: Int!
  warehouseLevel: Int!
}

"""
The camp or the party changed while the request ran, and no rule explains the failure. Nothing was changed; try again.
"""
type Conflict implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

"""Which adventure to discard."""
input DiscardAdventureInput {
  adventureId: ID!
}

"""
What discardAdventure answers: DiscardAdventureSuccess, or one of the refusals the union lists, each an Error.
"""
union DiscardAdventureResult = AdventureSettled | AdventureVerifiable | Conflict | DiscardAdventureSuccess

"""The mutation did its work: the adventure, discarded."""
type DiscardAdventureSuccess {
  adventure: Adventure!
}

"""
Another version of the game issued the adventure, so this deploy cannot verify it: try /previous/graphql, and discard it when that deploy says the same (decision 0030).
"""
type EngineUpdated implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!

  """This deploy's version."""
  version: String!
}

"""
A refusal: the game's rule the request failed, in the player's words. Every refusal type implements it; the type's name says which rule, and its own fields say what the client needs.
"""
interface Error {
  """In the player's words; the client may show it as it is."""
  message: String!
}

"""
A camp's own facilities, the engine's `FacilityKind`, those every camp has and those it may build.
"""
enum FacilityKind {
  CARAVAN_HUB
  HEROES_HALL
  JOB_BOARD
  LUMBER_CAMP
  MINE
  WAREHOUSE
}

"""One of a camp's own facilities and its level."""
type FacilityLevel {
  kind: FacilityKind!
  level: Int!
}

"""The heroes hall holds no more active heroes at its level."""
type HallFull implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!
}

"""The unit type needs a higher heroes hall."""
type HallLevel implements Error {
  """The hall level the unit type needs."""
  level: Int!

  """In the player's words; the client may show it as it is."""
  message: String!
}

"""
A hero, drawn by the hub at recruitment: its sprite set and name are never the client's choice.
"""
type Hero {
  id: ID!
  level: Int!

  """The location's id in the static content."""
  location: ID!
  name: String!
  recruitedAt: DateTime!
  retiredAt: DateTime

  """The set's directory under art/heroes/."""
  spriteSet: String!
  status: HeroStatus!
  unitType: UnitType!
  xp: Int!
}

"""
The hero is on an adventure: it can neither set out again nor retire until the adventure is settled.
"""
type HeroAdventuring implements Error {
  """The hero the refusal is about."""
  heroId: ID!

  """In the player's words; the client may show it as it is."""
  message: String!
}

"""A hero of the party is dead."""
type HeroDead implements Error {
  """The hero the refusal is about."""
  heroId: ID!

  """In the player's words; the client may show it as it is."""
  message: String!
}

"""A hero of the party is not at this camp."""
type HeroNotHere implements Error {
  """The hero the refusal is about."""
  heroId: ID!

  """In the player's words; the client may show it as it is."""
  message: String!
}

"""One hero of the party at settlement."""
type HeroOutcome {
  dead: Boolean!

  """Health at the end of the adventure."""
  health: Int!
  heroId: ID!

  """The hero's level after settlement."""
  level: Int!

  """The hero's XP after settlement."""
  xp: Int!
  xpGained: Int!
}

"""A hero of the party has retired."""
type HeroRetired implements Error {
  """The hero the refusal is about."""
  heroId: ID!

  """In the player's words; the client may show it as it is."""
  message: String!
}

"""Alive or dead at the camp, or retired for good."""
enum HeroStatus {
  ALIVE
  DEAD
  RETIRED
}

"""A camp's stock of one resource."""
type Holding {
  balance: Int!
  material: Material!
}

"""The camp cannot pay for it."""
type InsufficientResources implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!

  """Each resource the camp is short of."""
  short: [Shortfall!]!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON @specifiedBy(url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf")

"""
A job a location posts, on its job board or at a facility, from the static content; the client reads its stages from the engine it loaded.
"""
type Job {
  description: String!

  """
  The own facility that posts it, which the camp must have built to start it; null for a job on the job board.
  """
  facility: FacilityKind
  id: ID!

  """The location that posts it."""
  location: ID!
  name: String!
}

"""What joinGame answers: JoinGameSuccess, since nothing refuses it."""
union JoinGameResult = JoinGameSuccess

"""The mutation did its work: the player's profile, made or found."""
type JoinGameSuccess {
  player: Player!
}

"""The resources, the engine's `Material`: there is no currency."""
enum Material {
  CLOTH
  ORE
  TIMBER
}

"""The facility is at its highest level at this location."""
type MaxLevel implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!
}

"""
What a signed-in player does: joins the game, recruits and retires heroes, builds a facility, and starts, submits and discards an adventure.
"""
type Mutation {
  """
  Builds the next level of one of the camp's own facilities, at once, paid in resources from the camp's holdings, and answers the camp. The client names the level it is building, so a repeat finds it built and is answered with the camp, charging nothing. Refused with MaxLevel, Requires, InsufficientResources or Conflict; a camp or facility the player has none of, or a level that is not the next, is BAD_USER_INPUT.
  """
  buildFacility(input: BuildFacilityInput!): BuildFacilityResult

  """
  Discards the caller's open adventure when no deploy can verify it any more: its party comes home and nothing is credited. A discarded adventure answers as it is. Refused with AdventureVerifiable while this deploy or the previous one could still verify it, AdventureSettled, or Conflict; an adventure that is not the player's is BAD_USER_INPUT.
  """
  discardAdventure(input: DiscardAdventureInput!): DiscardAdventureResult

  """
  Makes the signed-in player's profile if they have none, named with their id, and answers it. Called by the client after every sign-in; a repeat changes nothing. Nothing refuses it.
  """
  joinGame: JoinGameResult

  """
  Recruits a hero of the unit type at the heroes hall of the starting camp, paid in resources from the camp's holdings; a villager is free when no hero at the camp is alive. The request id becomes the hero's id, so a repeat answers with the hero already made. Refused with HallLevel, HallFull, InsufficientResources or Conflict; a unit type the location does not recruit, or a request id reused for another unit type, is BAD_USER_INPUT.
  """
  recruitHero(input: RecruitHeroInput!): RecruitHeroResult

  """
  Retires one of the player's heroes, alive or dead: permanent, and the hero stays on the record. It frees a slot in the heroes hall. A hero already retired is answered as it is. Refused with HeroAdventuring or Conflict; a hero that is not the player's is BAD_USER_INPUT.
  """
  retireHero(input: RetireHeroInput!): RetireHeroResult

  """
  Starts a job the location posts, on its job board or at a facility the camp has built, with a party of one to four of the player's living heroes at that camp: issues the seed and the frozen snapshot, stamped with the deploy's version, and opens the player's one adventure. The client names the request, so a repeat finds the adventure it started and is answered with it as it is; the request id with another location, job or party is BAD_USER_INPUT. Refused with AdventureOpen while another is open, Requires while the facility that posts the job is not built, HeroDead, HeroRetired, HeroNotHere or HeroAdventuring for a hero of the party, or Conflict; a location or job the hub does not know, a party of the wrong size or a hero that is not the player's is BAD_USER_INPUT.
  """
  startAdventure(input: StartAdventureInput!): StartAdventureResult

  """
  Submits the caller's open adventure with its override log. The hub replays the log with the engine of the version that issued the adventure, stores the timeline, and settles: XP and levels, the rewards up to the warehouse's cap, the deaths. A settled adventure answers as it is; nothing is paid twice. Refused with EngineUpdated when another version issued it, AdventureDiscarded, or Conflict; an adventure that is not the player's, or a malformed log, is BAD_USER_INPUT.
  """
  submitAdventure(input: SubmitAdventureInput!): SubmitAdventureResult
}

"""Integers that will have a value of 0 or more."""
scalar NonNegativeInt

"""
One entry of the override log, as the engine kept it: a hero's forced action (UNIT, with unitId and abilityId) or a party order (PARTY, with order), stamped with the adventure's clock when it was taken up.
"""
input OverrideInput {
  """The ability forced, for a UNIT entry: at most 64 characters."""
  abilityId: String

  """Milliseconds on the adventure's clock."""
  acceptedAtSimTime: NonNegativeInt!
  kind: OverrideKind!

  """The order, for a PARTY entry."""
  order: PartyOrder

  """The hero, for a UNIT entry."""
  unitId: String
}

"""
What a log entry is: a hero's forced action, or an order to the whole party.
"""
enum OverrideKind {
  PARTY
  UNIT
}

"""
The orders a party takes: press on into the next stage, or retreat home.
"""
enum PartyOrder {
  PRESS_ON
  RETREAT
}

"""
A player: the id anyone may read, and the name, camps, heroes and open adventure only the player may.
"""
type Player {
  """
  Private: only the player may read their own camps. Null, with an error on this field, for anyone else.
  """
  camps: [Camp!]

  """Private: only the player may read their own heroes."""
  heroes: [Hero!]
  id: ID!

  """
  Private: the name the profile was made with, which is the player's id until a public name is decided. Null, with an error on this field, for anyone else.
  """
  name: String
  openAdventure: Adventure
}

"""Integers that will have a value greater than 0."""
scalar PositiveInt

"""
What a signed-in player reads: a player by id, themselves, the deploy's version, an adventure, and the heroes other players have left at a location.
"""
type Query {
  """
  An adventure by id: any settled one, for its replay; an open or discarded one only for its own player. Null otherwise.
  """
  adventure(id: ID!): Adventure

  """
  A random few of other players' heroes seen at the location lately, never all of them and never the caller's own.
  """
  heroesSeenAt(location: ID!): [SeenHero!]

  """The signed-in player, or null before joinGame has made their profile."""
  me: Player

  """
  Public: any caller may look a player up by id, and reads only the id back, or null where the id has no profile, so it also says whether an id is a player's.
  """
  player(id: ID!): Player

  """
  The deploy's version: the commit this route's deploy runs. /graphql answers the current deploy's, /previous/graphql the one before.
  """
  version: String
}

"""What to recruit, and the request's id."""
input RecruitHeroInput {
  """
  A UUID the client makes, which becomes the hero's id; a repeat answers the hero already made.
  """
  requestId: UUID!

  """A unit type on the location's recruitment list."""
  unitType: UnitType!
}

"""
What recruitHero answers: RecruitHeroSuccess, or one of the refusals the union lists, each an Error.
"""
union RecruitHeroResult = Conflict | HallFull | HallLevel | InsufficientResources | RecruitHeroSuccess

"""
The mutation did its work: the hero recruited, or already made by this request.
"""
type RecruitHeroSuccess {
  hero: Hero!
}

"""A facility the camp needs first, at this level or above."""
type Requirement {
  kind: FacilityKind!
  level: Int!
}

"""Another facility is needed first."""
type Requires implements Error {
  """In the player's words; the client may show it as it is."""
  message: String!

  """Each facility and the level it needs."""
  missing: [Requirement!]!
}

"""Which hero to retire."""
input RetireHeroInput {
  heroId: ID!
}

"""
What retireHero answers: RetireHeroSuccess, or one of the refusals the union lists, each an Error.
"""
union RetireHeroResult = Conflict | HeroAdventuring | RetireHeroSuccess

"""The mutation did its work: the hero, retired."""
type RetireHeroSuccess {
  hero: Hero!
}

"""An amount of one resource."""
type Reward {
  amount: Int!
  material: Material!
}

"""
Another player's hero seen at a location: its public fields only, and nothing that says whose it is (decision 0029).
"""
type SeenHero {
  id: ID!
  level: Int!
  name: String!

  """The set's directory under art/heroes/."""
  spriteSet: String!
  unitType: UnitType!
}

"""
One resource the camp is short of: what the thing costs and what the camp has.
"""
type Shortfall {
  """The amount the thing costs."""
  amount: Int!

  """The camp's balance."""
  balance: Int!
  material: Material!
}

"""
The frozen snapshot the hub issued at the start, the engine's AdventureSnapshot field for field: the party's effective numbers and the job by id (decision 0030).
"""
type Snapshot {
  heroes: [SnapshotHero!]!
  jobId: ID!
  version: String!
}

"""
A hero as the adventure took it at the start: its effective numbers, frozen for the run.
"""
type SnapshotHero {
  heroId: ID!
  level: Int!
  name: String!
  spriteSet: String!
  stats: UnitStats!
  unitType: UnitType!
}

"""
How a stage ended, the engine's `StageEnding`: DONE for travel and arrive; the rest are a battle's.
"""
enum StageEnding {
  DONE
  LOSS
  RETREAT
  TIMEOUT
  WIN
}

"""What a stage of a job is, the engine's `StageKind`."""
enum StageKind {
  ARRIVE
  FIGHT
  GATHER
  TRAVEL
}

"""How one stage the party entered ended."""
type StageResult {
  ended: StageEnding!
  endedAtMs: Int!
  kind: StageKind!
  stage: Int!
  startedAtMs: Int!
}

"""Which job to start, where, and with whom, and the request's id."""
input StartAdventureInput {
  """The party: one to four of the player's living heroes at that camp."""
  heroIds: [ID!]!

  """
  A job the location posts, on its job board or at a facility the camp has built.
  """
  jobId: ID!

  """The camp's location, which posts the job."""
  location: ID!

  """
  A UUID the client makes, which becomes the adventure's id; a repeat answers the adventure already started.
  """
  requestId: UUID!
}

"""
What startAdventure answers: StartAdventureSuccess, or one of the refusals the union lists, each an Error.
"""
union StartAdventureResult = AdventureOpen | Conflict | HeroAdventuring | HeroDead | HeroNotHere | HeroRetired | Requires | StartAdventureSuccess

"""The mutation did its work: the adventure opened."""
type StartAdventureSuccess {
  adventure: Adventure!
}

"""Which adventure to submit, with its override log."""
input SubmitAdventureInput {
  adventureId: ID!

  """
  The override log, as the engine kept it; empty when the player forced nothing, and at most 2000 entries.
  """
  overrides: [OverrideInput!]!
}

"""
What submitAdventure answers: SubmitAdventureSuccess, or one of the refusals the union lists, each an Error.
"""
union SubmitAdventureResult = AdventureDiscarded | Conflict | EngineUpdated | SubmitAdventureSuccess

"""The mutation did its work: the adventure, settled, with its result."""
type SubmitAdventureSuccess {
  adventure: Adventure!
}

"""
A field whose value is a generic Universally Unique Identifier: https://en.wikipedia.org/wiki/Universally_unique_identifier.
"""
scalar UUID

"""A unit's numbers in battle."""
type UnitStats {
  damage: Int!

  """Work done to a resource node by a gather ability."""
  gathering: Int!
  maxHealth: Int!

  """Turns per ten seconds."""
  speed: Int!
}

"""
The unit types, the engine's `UnitType`: what a hero is and what the hall recruits.
"""
enum UnitType {
  FIGHTER
  KNIGHT
  PRIEST
  RANGER
  VILLAGER
  WIZARD
}
