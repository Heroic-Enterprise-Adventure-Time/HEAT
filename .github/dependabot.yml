# Dependabot: the mechanism behind docs/standards/typescript.md rule 1,
# "falling behind is a defect to fix, not a state to maintain". Weekly, with
# minor and patch updates grouped per ecosystem so they arrive as one pull
# request; a major arrives on its own, so it is reviewed on its own. A major
# that cannot be taken is listed under "Held back" in the standards.
version: 2
updates:
  # The root holds the workspaces' single lock file.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # The majors the standards hold back, each with its reason under
    # "Held back" in docs/standards/typescript.md. A major leaves this list
    # and that list in the same pull request.
    ignore:
      - dependency-name: graphql
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Not held back: Angular's packages move together, by `ng update` on a
      # branch of their own (standards rule 13), so their majors are not
      # Dependabot's to open.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      # angular-eslint's major tracks Angular's, so it moves with them.
      - dependency-name: angular-eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # One root per stack and environment (decision 0016); each has its own
  # lock file.
  - package-ecosystem: terraform
    directories:
      - /terraform/backend
      - /terraform/bootstrap/sandbox
      - /terraform/bootstrap/dev
      - /terraform/bootstrap/prod
      - /terraform/environment/sandbox-base
      - /terraform/environment/sandbox
      - /terraform/environment/dev
      - /terraform/environment/prod
    schedule:
      interval: weekly
    groups:
      terraform-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
