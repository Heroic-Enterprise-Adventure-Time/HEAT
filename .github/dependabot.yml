# Dependabot: the mechanism behind docs/standards/typescript.md rule 1,
# "falling behind is a defect to fix, not a state to maintain". Weekly, with
# minor and patch updates grouped per ecosystem so they arrive as one pull
# request; a major arrives on its own, so it is reviewed on its own. A major
# that cannot be taken is listed under "Held back" in the standards.
version: 2
updates:
  # The root holds the workspaces' single lock file.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # The exception to "a major arrives on its own": codegen's CLI and its
      # plugins change major together, and each alone fails the codegen check
      # (Issue-309, PR-306 to PR-308). Their minors stay in the group above,
      # because a dependency goes to the first group it matches (Dependabot
      # options reference, "groups", read 2026-11-16).
      graphql-codegen-major:
        patterns: ["@graphql-codegen/*"]
        update-types: [major]
    # What the standards hold back, majors and one minor, each with its
    # reason under "Held back" in docs/standards/typescript-dependencies.md.
    # An entry leaves this list and that list in the same pull request.
    ignore:
      - dependency-name: graphql
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Held at the version AWS's OpenTelemetry layer carries, a minor and
      # not a major, with the context manager of the test's SDK (decision
      # 0055).
      - dependency-name: "@opentelemetry/api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@opentelemetry/context-async-hooks"
        update-types: ["version-update:semver-major"]
      # Not held back: Angular's packages move together, by `ng update` on a
      # branch of their own (standards rule 13), so their majors are not
      # Dependabot's to open.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      # angular-eslint's major tracks Angular's, so it moves with them.
      - dependency-name: angular-eslint
        update-types: ["version-update:semver-major"]

  # The images tests start, each the FROM line of a *.Dockerfile that
  # nothing builds, pinned by version and digest; Dependabot moves both
  # together (docs/standards/typescript.md, rule 33). A new one is listed
  # here, which packages/hub/test/images.test.ts checks.
  - package-ecosystem: docker
    directories:
      - /packages/hub/test/setup
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    # The workflows, and the composite actions they share. GitHub documents
    # that an update to a locked workflow regenerates its entries in
    # .github/workflows/actions.lock in the same pull request (decision
    # 0047). Whether an update to a composite action under .github/actions
    # does too is not documented; "Build and test" refuses the pull request
    # if it does not, and the lockfile is regenerated on its branch.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # One root per stack and environment (decision 0016); each has its own
  # lock file.
  - package-ecosystem: terraform
    directories:
      - /terraform/backend
      - /terraform/bootstrap/sandbox
      - /terraform/bootstrap/dev
      - /terraform/bootstrap/prod
      - /terraform/environment/sandbox-base
      - /terraform/environment/sandbox
      - /terraform/environment/dev
      - /terraform/environment/prod
    schedule:
      interval: weekly
    groups:
      terraform-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
