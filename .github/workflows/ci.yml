# Build and test
#
# The gate on every pull request and on main: does the repository build, do
# its tests pass, does the client build for production, is the committed
# GraphQL schema current, does every function bundle, and is every Terraform
# root formatted and valid. It runs
# with no AWS credentials; the integration tests start their own containers
# (decision 0009) and the Terraform roots are initialised without a backend.
# It never deploys anything: deploy.yml plans and applies the permanent
# roots, under their GitHub environments, and sandbox.yml the per-issue
# stacks (decision 0017).
name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exactly what package-lock.json records
        run: npm ci

      - name: Typecheck every package
        run: npm run typecheck

      - name: Run every package's tests (integration tests start containers)
        run: npm test

      # The output a stack's bucket serves (Issue-39); the log shows the
      # bundle sizes against the budgets in packages/client/angular.json.
      - name: Build the client for production
        run: npm run build --workspace @heat/client

      - name: Check that the committed GraphQL schema matches the code
        run: |
          npm run schema:print
          git diff --exit-code -- packages/hub/schema.graphql

      - name: Bundle every function for Lambda
        run: npm run bundle

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The latest release, on purpose: format and validate are stable across
      # releases, each root states its own floor in required_version, and the
      # owner's machine is expected to track the latest too (standards rule 1).
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff
        working-directory: terraform

      # One root per stack and environment (decision 0016). Initialised with
      # the backend off, so no state and no credentials are touched; the lock
      # file pins the provider that validate loads.
      - name: Validate every root
        run: |
          set -eu
          for root in terraform/backend terraform/bootstrap/sandbox terraform/bootstrap/dev terraform/bootstrap/prod terraform/environment/sandbox-base terraform/environment/sandbox; do
            echo "== $root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
