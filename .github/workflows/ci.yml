# Build and test
#
# The gate on every pull request and on main: does the repository build, does
# it lint clean, do its tests pass, does the client build for production, is
# the committed GraphQL schema current and the client's generated code with
# it, does every function bundle, is every Terraform root formatted, valid
# and clean under tflint and trivy, does every workflow lint clean under
# actionlint, and does the actions lockfile cover it. It runs with no AWS
# credentials; the integration tests start their own containers (decision
# 0009) and the Terraform roots are initialised without a backend.
# It never deploys anything: deploy.yml plans and applies the permanent
# roots, under their GitHub environments, and sandbox.yml the per-issue
# stacks (decision 0017).
name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every run step runs as `bash --noprofile --norc -eo pipefail {0}`. With no
# shell named, GitHub runs `bash -e {0}`, where a pipe's status is its last
# command's: a stack test that failed into tee left the run green (Issue-137).
defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # Declared, not inherited: this job runs npm (docs/process/best-practices.md,
    # rule 13).
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node, pinned and checked
        uses: $/.github/actions/node

      - name: Install exactly what package-lock.json records
        run: npm ci

      - name: Typecheck every package
        run: npm run typecheck

      # The deterministic floor of review (docs/standards/typescript.md,
      # rule 16): one flat config for every workspace, with type information.
      - name: Lint every package
        run: npm run lint

      - name: Run every package's tests (integration tests start containers)
        run: npm test

      # The output a stack's bucket serves (Issue-39); the log shows the
      # bundle sizes against the budgets in packages/client/angular.json.
      - name: Build the client for production
        run: npm run build --workspace @heat/client

      - name: Check that the committed GraphQL schema matches the code
        run: |
          npm run schema:print
          git diff --exit-code -- packages/hub/schema.graphql

      # The client's operations and types are generated from that schema
      # (codegen.mjs); a stale file fails here as a stale schema does.
      - name: Check that the client's generated GraphQL code matches the schema and its operations
        run: |
          npm run codegen
          git diff --exit-code -- packages/client/src/app/graphql/generated

      - name: Bundle every function for Lambda
        run: npm run bundle

  terraform:
    name: Terraform format, validate, lint and scan
    runs-on: ubuntu-latest
    # Declared, not inherited: this job runs tflint, its ruleset and trivy
    # (docs/process/best-practices.md, rule 13).
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      # The one exact release the plan and apply jobs run, from the same
      # action, so the floor checks the binary that applies; each root states
      # its own floor in required_version, and the owner's machine tracks the
      # pin (docs/standards/terraform.md, rule 13).
      - name: Set up Terraform, pinned and checked
        uses: $/.github/actions/terraform

      - name: Check formatting
        run: terraform fmt -check -recursive -diff
        working-directory: terraform

      # One root per stack and environment (decision 0016). Initialised with
      # the backend off, so no state and no credentials are touched; the lock
      # file pins the provider that validate loads.
      - name: Validate every root
        run: |
          set -eu
          for root in terraform/backend terraform/bootstrap/sandbox terraform/bootstrap/dev terraform/bootstrap/prod terraform/environment/sandbox-base terraform/environment/sandbox terraform/environment/dev terraform/environment/prod; do
            echo "== $root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      # tflint, pinned, with the rulesets terraform/.tflint.hcl names; the
      # token is for downloading the AWS ruleset from GitHub without hitting
      # the anonymous rate limit (docs/standards/terraform.md, rule 17).
      # The archive's checksum pins the build, not only its tag (rule 14 of
      # docs/process/best-practices.md); it is the release's checksums.txt
      # line for linux_amd64, a file whose build attestation was verified
      # with `gh attestation verify --repo terraform-linters/tflint` when the
      # version was taken (2026-11-08). The AWS ruleset is checked by tflint
      # itself, which verifies a plugin's attestation by default.
      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.65.0
          checksums: d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61

      - name: Lint every root and module
        run: |
          tflint --init
          tflint --recursive
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # trivy's misconfiguration checks, pinned, from its release archive,
      # verified before it runs the way trivy's own document says (read
      # 2026-11-02): cosign checks the archive against the Sigstore bundle
      # published beside it, with the signer pinned to trivy's release
      # workflow at this tag. The archive and the bundle come from the
      # release's own URL, not through the API: the aquasecurity
      # organization's IP allow list refuses a runner's token on its API,
      # which is where `gh release download` failed on the first run
      # (41548590530), so the attestation route actionlint takes below is
      # closed here. The install script trivy's document offers pipes a fetch
      # into sh, which this project does not do. The options and the pinned
      # checks bundle are terraform/trivy.yaml, the standing excuses
      # terraform/.trivyignore (docs/standards/terraform.md, rule 17).
      # The exact release: the installer publishes no floating major tag.
      - name: Set up cosign
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Set up trivy
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          set -eu
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          release="https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" "$release/$archive"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.sigstore.json" "$release/$archive.sigstore.json"
          cosign verify-blob "$RUNNER_TEMP/$archive" \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v$TRIVY_VERSION"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version

      # The command a laptop runs (docs/process/development.md, rule 2): the
      # roots and modules, with trivy.yaml and .trivyignore read from here.
      - name: Scan every root and module for misconfigurations
        run: |
          "$RUNNER_TEMP/trivy" config .
        working-directory: terraform

  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    # Declared, not inherited: this job runs actionlint and gh-actions-lock
    # (docs/process/best-practices.md, rule 13).
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      # actionlint, pinned, from its release archive, with the archive's build
      # attestation verified before it runs: the check its install document
      # recommends (read 2026-11-02). The download script the document also
      # offers pipes a fetch into bash, which this project does not do. The
      # runner has shellcheck, so every run step's script is checked too
      # (docs/process/development.md, rule 2).
      - name: Set up actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -eu
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$archive" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$archive" --repo rhysd/actionlint
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      # With no argument actionlint finds every workflow under .github/workflows.
      - name: Lint every workflow
        run: |
          "$RUNNER_TEMP/actionlint" -color

      # Every action the workflows use runs at the commit
      # .github/workflows/actions.lock records (decision 0047). The extension
      # is the release the lockfile was written with, taken as actionlint is
      # above, from the release's binary with its build attestation verified
      # before it runs (docs/process/best-practices.md, rule 14): `gh
      # extension install --pin` takes only a tag for a binary extension,
      # and a tag can move. The binary runs on its own, outside gh, reading
      # GH_TOKEN; --verify writes nothing and fails on a workflow or a
      # `uses:` with no entry, or on a locked commit that is no longer
      # reachable upstream.
      - name: Set up gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONS_LOCK_VERSION: 0.4.1
        run: |
          set -eu
          binary="$RUNNER_TEMP/gh-actions-lock"
          gh release download "v$ACTIONS_LOCK_VERSION" --repo github/gh-actions-lock --pattern linux-amd64 --output "$binary"
          gh attestation verify "$binary" --repo github/gh-actions-lock
          chmod +x "$binary"

      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/gh-actions-lock" --verify
