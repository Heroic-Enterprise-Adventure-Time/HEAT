# Sandbox stacks
#
# Every working branch has a stack in heat-sandbox, heat-sb<issue>, named
# from the issue number in the branch name (decision 0018): created on the
# first push, re-applied on every push, destroyed when the branch is
# deleted, and swept weekly in case a deletion was missed. Each stack's jobs
# run under the GitHub environment sandbox-<issue>, which GitHub creates on
# first reference and the sandbox apply role trusts by the pattern
# sandbox-* (decision 0019). The stacks take no secret (decision 0020).
#
# Four triggers:
#   push      checks, bundle and client build, cap, plan with the
#             allow-list, apply, the client published to the stack's
#             bucket with config.json, the stack test through the stack's
#             hostname; the URL in the job summary, on the deployment and,
#             when the branch has an open pull request, in one comment on
#             it. The checks run here so that a stack always holds a commit
#             that typechecks and passes the tests (0017); until Issue-53
#             they also run in Build and test while a pull request is open.
#   pull_request (opened, reopened)   the URL comment alone, so the pull
#             request carries it from its first minute; the hostname is
#             known from the issue number, with no apply. Not on a release
#             pull request, whose head is main and has no stack.
#   delete    destroy the branch's stack from its state key, with main's
#             copy of the root. The root evaluates the bundle's hash even to
#             destroy, so the job bundles first. The distribution's destroy
#             is minutes: CloudFront disables it, deploys that, then deletes.
#   schedule, workflow_dispatch   the sweep: every stack whose branch is
#             gone is destroyed; a dispatch with dry_run lists and destroys
#             nothing.
#
# Which stack a job acts on is decided by scripts/sandbox.mjs from the ref,
# the same script a person or the agent runs on a laptop, so the key and
# the name cannot be typed inconsistently. A job's environment can only be
# named from `needs` and `github`, never from its own steps, which is why a
# small job names the stack first. base/ under the sandbox prefix is the
# permanent base, never a stack: the script never counts, lists or destroys
# it. Nothing here runs for main, release, tags or Dependabot's branches.
#
# GitHub runs the delete and schedule events, and a workflow_dispatch from
# the Actions tab, from the copy of this file on the default branch; a push
# runs the branch's copy. A change to the delete or sweep jobs therefore
# takes effect once it is on main, and a branch whose workflow is not yet
# on main leaves an orphan when deleted, which the sweep collects.
name: Sandbox stacks

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "infra/**"
      - "chore/**"
      - "hotfix/**"
  pull_request:
    types: [opened, reopened]
  delete:
  schedule:
    # Sundays 06:00 UTC.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the orphaned stacks and destroy nothing"
        type: boolean
        default: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  # The cap on concurrent sandbox stacks (decision 0018, as amended): a push
  # is refused while this many other stacks have state.
  SANDBOX_STACK_CAP: "5"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- push --
  checks:
    name: Checks and bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.stack.outputs.issue }}
      name: ${{ steps.stack.outputs.name }}
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Name the stack from the branch
        id: stack
        run: |
          set -eu
          echo "issue=$(node scripts/sandbox.mjs issue --branch "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          echo "name=$(node scripts/sandbox.mjs name --branch "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Install exactly what package-lock.json records
        run: npm ci

      - name: Typecheck every package
        run: npm run typecheck

      - name: Run every package's tests (integration tests start containers)
        run: npm test

      - name: Check that the committed GraphQL schema matches the code
        run: |
          npm run schema:print
          git diff --exit-code -- packages/hub/schema.graphql

      - name: Bundle every function for Lambda
        run: npm run bundle

      - name: Upload the bundles for the apply job
        uses: actions/upload-artifact@v6
        with:
          name: bundles
          path: dist/
          if-no-files-found: error
          retention-days: 1

      # What the stack's bucket serves (Issue-39); one build serves any
      # stack, because config.json is written beside it at publish time.
      - name: Build the client for production
        run: npm run build --workspace @heat/client

      - name: Upload the client for the apply job
        uses: actions/upload-artifact@v6
        with:
          name: client
          path: packages/client/dist/client/browser/
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply the branch's stack
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: sandbox-${{ needs.checks.outputs.issue }}
      url: ${{ steps.summary.outputs.site_url }}
    # One apply at a time per stack, never cancelled (decision 0017).
    concurrency:
      group: sandbox-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      # The stack URL comment on the branch's pull request.
      pull-requests: write
    env:
      TF_VAR_workload_account_id: ${{ vars.HEAT_SANDBOX_ACCOUNT_ID }}
      # The deploy's version, the commit this run deploys (decision 0030):
      # the hub's HEAT_VERSION and config.json's version from Issue-113. A
      # root without the variable ignores it.
      TF_VAR_app_version: ${{ github.sha }}
      ACCOUNT_ID: ${{ vars.HEAT_SANDBOX_ACCOUNT_ID }}
      ISSUE: ${{ needs.checks.outputs.issue }}
      STACK: ${{ needs.checks.outputs.name }}
    steps:
      - name: Refuse to run without the account id
        run: |
          set -eu
          [ -n "$ACCOUNT_ID" ] || { echo "The repository variable HEAT_SANDBOX_ACCOUNT_ID is not set." >&2; exit 1; }
          echo "::add-mask::$ACCOUNT_ID"

      - name: Check out the branch
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Download the bundles
        uses: actions/download-artifact@v7
        with:
          name: bundles
          path: dist/

      - name: Download the client
        uses: actions/download-artifact@v7
        with:
          name: client
          path: client/

      - name: Assume the apply role through GitHub's OIDC provider
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/heat-sandbox-apply
          role-session-name: sandbox-apply-${{ env.ISSUE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Refuse to exceed the cap on concurrent stacks
        run: node scripts/sandbox.mjs cap "$SANDBOX_STACK_CAP" --issue "$ISSUE"

      - name: Plan
        run: |
          set -eu
          node scripts/sandbox.mjs init --issue "$ISSUE"
          node scripts/sandbox.mjs plan --issue "$ISSUE" -- -out "$RUNNER_TEMP/plan.tfplan"

      - name: Check the plan against the resource-type allow-list
        run: |
          set -eu
          terraform -chdir=terraform/environment/sandbox show -json "$RUNNER_TEMP/plan.tfplan" > "$RUNNER_TEMP/plan.json"
          node scripts/check-plan-resource-types.mjs "$RUNNER_TEMP/plan.json"

      - name: Write the plan to the job summary
        env:
          ENVIRONMENT: sandbox-${{ env.ISSUE }}
        run: sh scripts/post-terraform-plan.sh sandbox "$RUNNER_TEMP/plan.tfplan" "$GITHUB_SHA" "apply role"

      # Exactly the plan that was checked, not a fresh one.
      - name: Apply
        run: node scripts/sandbox.mjs apply --issue "$ISSUE" -- "$RUNNER_TEMP/plan.tfplan"

      # The content is the apply job's, not Terraform's: the client build
      # from the checks job and config.json from the stack's outputs
      # (terraform/modules/site/README.md, "What is not here").
      - name: Publish the client and config.json to the stack's bucket
        run: |
          set -eu
          bucket="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw client_bucket)"
          pool_id="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw user_pool_id)"
          client_id="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw browser_client_id)"
          login_host="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw login_host)"
          password_sign_in="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw password_sign_in)"
          app_version="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw app_version)"
          sh scripts/publish-client.sh "$bucket" client "/graphql" "$pool_id" "$client_id" "$login_host" "$password_sign_in" "$app_version"

      - name: Write the stack's URL to the job summary
        id: summary
        run: |
          set -eu
          site_url="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw site_url)"
          api_url="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw api_url)"
          prefix="$(node scripts/sandbox.mjs output --issue "$ISSUE" -- -raw parameter_prefix)"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Stack \`$STACK\`"
            echo
            echo "Site: $site_url (the page with Sign in with Google, POST /graphql with a Bearer token from the browser client or the base's ci client, /config.json for the client)."
            echo
            echo "API behind it: \`$api_url\`. Parameters under \`$prefix\`: site_url, api_url, user_pool_id, app_client_id, browser_client_id, login_host."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the stack's URL on the branch's pull request, if one is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/post-stack-url.sh "$ISSUE" "${{ steps.summary.outputs.site_url }}"

      # The stack test (decision 0018: the stack is the system). The engine
      # is built because the test compares the hub's answer with it.
      - name: Install and build the engine for the stack test
        run: |
          set -eu
          npm ci
          npm run build --workspace @heat/engine

      - name: Mint the stack's test user
        run: sh scripts/e2e-user.sh ensure heat-sb-base-users "e2e-$ISSUE@heat-sb.dcg-games.com"

      - name: Call the stack as that user
        id: e2e
        run: |
          set -eu
          echo "since=$(date +%s000)" >> "$GITHUB_OUTPUT"
          node scripts/e2e.mjs --issue "$ISSUE" --username "e2e-$ISSUE@heat-sb.dcg-games.com" | tee -a "$RUNNER_TEMP/e2e.log"
          {
            echo
            echo '```text'
            cat "$RUNNER_TEMP/e2e.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the cold start
        run: sh scripts/report-cold-start.sh "/aws/lambda/$STACK-hub" "${{ steps.e2e.outputs.since }}"

  # -------------------------------------------------------- pull request --
  comment-url:
    name: Comment the stack's URL on the pull request
    # A release pull request has main as its head: no issue number, so no
    # stack and no URL (decision 0021). A hotfix/<issue>-* head has a stack
    # and keeps its comment.
    if: github.event_name == 'pull_request' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # The hostname follows from the issue number in the branch name, so
      # the comment needs no apply and no AWS credentials.
      - name: Post the comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          issue="$(node scripts/sandbox.mjs issue --branch "$HEAD_REF")"
          sh scripts/post-stack-url.sh "$issue" "https://$issue.heat-sb.dcg-games.com" "$PR_NUMBER"

  # -------------------------------------------------------------- delete --
  name-deleted:
    name: Name the deleted branch's stack
    # Only a branch of the working shape has a stack; tags and other
    # branches end here, silently.
    if: >-
      github.event_name == 'delete'
      && github.event.ref_type == 'branch'
      && (startsWith(github.event.ref, 'feat/') || startsWith(github.event.ref, 'fix/')
          || startsWith(github.event.ref, 'docs/') || startsWith(github.event.ref, 'infra/')
          || startsWith(github.event.ref, 'chore/') || startsWith(github.event.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.stack.outputs.issue }}
      name: ${{ steps.stack.outputs.name }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Name the stack from the deleted branch
        id: stack
        env:
          DELETED_REF: ${{ github.event.ref }}
        run: |
          set -eu
          echo "issue=$(node scripts/sandbox.mjs issue --branch "$DELETED_REF")" >> "$GITHUB_OUTPUT"
          echo "name=$(node scripts/sandbox.mjs name --branch "$DELETED_REF")" >> "$GITHUB_OUTPUT"

  destroy:
    name: Destroy the deleted branch's stack
    needs: name-deleted
    runs-on: ubuntu-latest
    environment:
      name: sandbox-${{ needs.name-deleted.outputs.issue }}
    concurrency:
      group: sandbox-refs/heads/${{ github.event.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_workload_account_id: ${{ vars.HEAT_SANDBOX_ACCOUNT_ID }}
      # The deploy's version, the commit this run deploys (decision 0030):
      # the hub's HEAT_VERSION and config.json's version from Issue-113. A
      # root without the variable ignores it.
      TF_VAR_app_version: ${{ github.sha }}
      ACCOUNT_ID: ${{ vars.HEAT_SANDBOX_ACCOUNT_ID }}
      ISSUE: ${{ needs.name-deleted.outputs.issue }}
      STACK: ${{ needs.name-deleted.outputs.name }}
    steps:
      - name: Refuse to run without the account id
        run: |
          set -eu
          [ -n "$ACCOUNT_ID" ] || { echo "The repository variable HEAT_SANDBOX_ACCOUNT_ID is not set." >&2; exit 1; }
          echo "::add-mask::$ACCOUNT_ID"

      # The branch itself is gone; main's copy of the root destroys from the
      # state key.
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Bundle, because the root evaluates the bundle's hash even to destroy
        run: |
          set -eu
          npm ci
          npm run bundle

      - name: Assume the apply role through GitHub's OIDC provider
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/heat-sandbox-apply
          role-session-name: sandbox-destroy-${{ env.ISSUE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy
        run: |
          set -eu
          node scripts/sandbox.mjs init --issue "$ISSUE"
          node scripts/sandbox.mjs destroy --issue "$ISSUE" -- -auto-approve
          node scripts/sandbox.mjs forget --issue "$ISSUE"
          sh scripts/e2e-user.sh delete heat-sb-base-users "e2e-$ISSUE@heat-sb.dcg-games.com"
          echo "Destroyed \`$STACK\`, removed its state and its test user." >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- sweep --
  sweep:
    name: Sweep orphaned stacks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A fixed environment of its own, which the apply role's sandbox-*
    # pattern admits, because the stacks it finds are only known once it
    # has listed them.
    environment:
      name: sandbox-sweep
    concurrency:
      group: sandbox-sweep
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_workload_account_id: ${{ vars.HEAT_SANDBOX_ACCOUNT_ID }}
      # The deploy's version, the commit this run deploys (decision 0030):
      # the hub's HEAT_VERSION and config.json's version from Issue-113. A
      # root without the variable ignores it.
      TF_VAR_app_version: ${{ github.sha }}
      ACCOUNT_ID: ${{ vars.HEAT_SANDBOX_ACCOUNT_ID }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
    steps:
      - name: Refuse to run without the account id
        run: |
          set -eu
          [ -n "$ACCOUNT_ID" ] || { echo "The repository variable HEAT_SANDBOX_ACCOUNT_ID is not set." >&2; exit 1; }
          echo "::add-mask::$ACCOUNT_ID"

      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Assume the apply role through GitHub's OIDC provider
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/heat-sandbox-apply
          role-session-name: sandbox-sweep
          aws-region: ${{ env.AWS_REGION }}

      - name: List the stacks whose branch is gone
        id: orphans
        run: |
          set -eu
          orphans="$(node scripts/sandbox.mjs orphans | tr '\n' ' ' | sed 's/ *$//')"
          echo "orphans=$orphans" >> "$GITHUB_OUTPUT"
          if [ -z "$orphans" ]; then
            echo "No orphaned sandbox stack." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Orphaned sandbox stacks (issue numbers): $orphans" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bundle, because the root evaluates the bundle's hash even to destroy
        if: steps.orphans.outputs.orphans != '' && env.DRY_RUN != 'true'
        run: |
          set -eu
          npm ci
          npm run bundle

      - name: Destroy each orphan
        if: steps.orphans.outputs.orphans != '' && env.DRY_RUN != 'true'
        env:
          ORPHANS: ${{ steps.orphans.outputs.orphans }}
        run: |
          set -eu
          for issue in $ORPHANS; do
            echo "== destroying heat-sb$issue"
            node scripts/sandbox.mjs init --issue "$issue"
            node scripts/sandbox.mjs destroy --issue "$issue" -- -auto-approve
            node scripts/sandbox.mjs forget --issue "$issue"
            sh scripts/e2e-user.sh delete heat-sb-base-users "e2e-$issue@heat-sb.dcg-games.com"
            echo "Destroyed \`heat-sb$issue\`, removed its state and its test user." >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Dry run
        if: steps.orphans.outputs.orphans != '' && env.DRY_RUN == 'true'
        run: |
          echo "Dry run: nothing destroyed." | tee -a "$GITHUB_STEP_SUMMARY"
