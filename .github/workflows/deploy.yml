# Deploy
#
# The pipeline's Terraform path for the permanent roots (decision 0017): a
# plan on every pull request to main, posted on the pull request, and a plan
# and apply on every merge to main. Nothing else applies an environment.
#
# Each permanent root is one row of the matrix, and its jobs run under that
# root's own GitHub environment, which holds its secrets and admits only the
# branch main (decision 0020). Two rows today: sandbox-base (Issue-37) and
# dev (Issue-40). prod is not a row here: it ships through the release
# branch (decision 0021), with its own triggers and its own jobs, in
# release.yml (Issue-41). A row with code (dev) downloads the
# bundles before planning, because the root hashes the bundle, and after
# the apply publishes the client build with config.json and creates the test
# users; then dev's stack-test job runs the smoke test through the
# environment's hostname and the browser test (decision 0045), and its
# cold-start job reads the cold start, as sandbox.yml does for a per-issue
# stack; sandbox-base has no code and skips those steps.
#
# A job that runs downloaded code holds no role and no environment's secrets,
# because a step cannot give up what its job holds
# (docs/process/best-practices.md, rule 13; decision 0046): npm and what it
# installs run in the build and stack-test jobs, and the plan, apply and
# cold-start jobs run only Terraform, this repository's scripts and the AWS CLI.
#
# Why pull_request_target and not pull_request: the pull request's plan must
# run under the root's environment to see its real values, and the
# environment's branch policy is matched against the run's ref. A
# pull_request run has the ref refs/pull/<n>/merge, which no policy admits;
# a pull_request_target run carries main's ref and executes main's copy of
# this file. The price is that the job checks out and plans the pull
# request's head with the environment's credentials, so Terraform from an
# untrusted head would run as the plan role. Heads from other repositories
# are therefore refused before anything runs; for heads of this repository
# the risk is the one decision 0020 accepts, a repository whose every author
# is trusted. Two consequences of the trigger worth knowing: a new or
# changed copy of this file takes effect for pull requests only once it is
# on main, so the pull request that adds a row gets no plan for it, and
# Dependabot's pull requests get no plan, since their runs see no secrets;
# the apply on main plans anyway.
#
# The plan role is read only and plans with -lock=false. The apply role
# plans again, checks the plan, and applies exactly the plan it checked.
# Both jobs run the allow-list check of decision 0017, guardrail 2
# (scripts/check-plan-resource-types.mjs), and write the plan into the job
# summary, guardrail 4, through scripts/post-terraform-plan.sh, which also
# keeps the pull request's one plan comment per root and replaces the
# account id in everything it posts (docs/README.md, rule 9). Anything
# longer than a few lines, or needed by both jobs, is a script under
# scripts/; the workflow is the sequence of steps.
name: Deploy

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

# One merge's run at a time, whole: the next merge's apply resets the test
# user's password and moves the version, so it cannot land between this run's
# apply and its stack test. Pull requests' plans never wait for each other.
concurrency:
  group: deploy-run-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

# Every run step runs as `bash --noprofile --norc -eo pipefail {0}`. With no
# shell named, GitHub runs `bash -e {0}`, where a pipe's status is its last
# command's: a stack test that failed into tee left the run green (Issue-137).
defaults:
  run:
    shell: bash

jobs:
  # The functions for the plan, which hashes them, and on a merge the client
  # for the publish step after the apply. No role, no environment and no
  # secrets. On a pull request this is its head's code, as the plan's is.
  build:
    name: Bundle and build
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out what this run plans
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node, pinned and checked
        uses: $/.github/actions/node

      - name: Install exactly what package-lock.json records
        run: npm ci

      - name: Bundle, and on a merge build the client
        uses: $/.github/actions/bundle
        with:
          client: ${{ github.event_name == 'push' }}

  plan:
    name: Plan ${{ matrix.root }}
    # Only pull requests from this repository, and not Dependabot's.
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One row per permanent root. The role ARN is the account id
          # secret plus the committed role name (terraform/bootstrap/README.md).
          # code is true where the root hashes the function bundles.
          - root: sandbox-base
            environment: sandbox-base
            role: heat-sandbox-plan
            code: false
          - root: dev
            environment: dev
            role: heat-dev-plan
            code: true
    env:
      # The deploy's version (decision 0030): the pull request's head, which
      # this job checks out and plans. Not github.sha, which in a
      # pull_request_target run is the base branch's tip. A root without the
      # variable ignores it; it is on main before the roots require it,
      # because this job runs main's copy of the file (Issue-121).
      TF_VAR_app_version: ${{ github.event.pull_request.head.sha }}
      # The base's Google OAuth client and the alarms' address, from the
      # environment this job runs under: one name in every environment, the
      # environment supplies the value (decision 0020). An environment
      # without them yields empty strings, which the root's variables refuse
      # by name; a root without the variable ignores the TF_VAR.
      TF_VAR_google_client_id: ${{ vars.HEAT_GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.HEAT_GOOGLE_CLIENT_SECRET }}
      TF_VAR_alarm_email: ${{ vars.HEAT_ALARM_EMAIL }}
    steps:
      # The row's account id, a repository secret so that GitHub masks it in
      # every log line, the env echo included (docs/README.md, rule 9; decision
      # 0035). The secrets context is not available in a matrix, so the row
      # cannot carry the id: both secrets are in this step's env and the root
      # chooses, so that the guard reads exactly the value the job will use (an
      # `&& ... ||` expression would fall back to the other secret when the
      # row's is empty). Written to GITHUB_ENV once, for every later step.
      - name: Pick the row's account id, or refuse to run
        env:
          ROOT: ${{ matrix.root }}
          SANDBOX_ACCOUNT_ID: ${{ secrets.HEAT_SANDBOX_ACCOUNT_ID }}
          DEV_ACCOUNT_ID: ${{ secrets.HEAT_DEV_ACCOUNT_ID }}
        run: |
          set -eu
          case "$ROOT" in
            dev) account="$DEV_ACCOUNT_ID"; secret=HEAT_DEV_ACCOUNT_ID ;;
            *)   account="$SANDBOX_ACCOUNT_ID"; secret=HEAT_SANDBOX_ACCOUNT_ID ;;
          esac
          [ -n "$account" ] || { echo "The repository secret $secret is not set." >&2; exit 1; }
          { echo "ACCOUNT_ID=$account"; echo "TF_VAR_workload_account_id=$account"; } >> "$GITHUB_ENV"

      - name: Check out the pull request's head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Terraform, pinned and checked
        uses: $/.github/actions/terraform

      - name: Set up Node, pinned and checked
        uses: $/.github/actions/node

      # The root zips dist/<name>/ and plans the function from its hash
      # (decision 0017), so the bundle exists before the plan.
      - name: Download the bundles
        if: matrix.code
        uses: actions/download-artifact@v8.0.2
        with:
          name: bundles
          path: dist/

      - name: Assume the plan role through GitHub's OIDC provider
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ matrix.role }}
          role-session-name: deploy-plan-${{ matrix.root }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        run: |
          set -eu
          terraform -chdir="terraform/environment/${{ matrix.root }}" init
          terraform -chdir="terraform/environment/${{ matrix.root }}" plan -lock=false -out "$RUNNER_TEMP/plan.tfplan"

      - name: Check the plan against the resource-type allow-list
        run: |
          set -eu
          terraform -chdir="terraform/environment/${{ matrix.root }}" show -json "$RUNNER_TEMP/plan.tfplan" > "$RUNNER_TEMP/plan.json"
          node scripts/check-plan-resource-types.mjs "$RUNNER_TEMP/plan.json"

      - name: Write the plan to the job summary and the pull request
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/post-terraform-plan.sh "${{ matrix.root }}" "$RUNNER_TEMP/plan.tfplan" "${{ github.event.pull_request.head.sha }}" "plan role" "${{ github.event.pull_request.number }}"

  apply:
    name: Apply ${{ matrix.root }}
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.summary.outputs.site_url }}
    # One apply at a time per root, and never cancelled: a cancelled apply
    # can leave the state lock behind, so applies queue (decision 0017).
    concurrency:
      group: deploy-${{ matrix.root }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same rows as the plan job. test_users is true where the
          # test-user step runs: the sandbox and dev, never prod (decision
          # 0020). The step reads the environment's HEAT_TEST_USER_PASSWORD;
          # the name is the same in every environment and the environment
          # supplies the value. stack names the environment's resources,
          # heat-<environment>, for the smoke test and the cold start.
          - root: sandbox-base
            environment: sandbox-base
            role: heat-sandbox-apply
            test_users: true
            code: false
          - root: dev
            environment: dev
            role: heat-dev-apply
            test_users: true
            code: true
            stack: heat-dev
    env:
      # The deploy's version, the commit this run deploys (decision 0030):
      # the hub's HEAT_VERSION and config.json's version from Issue-113. A
      # root without the variable ignores it.
      TF_VAR_app_version: ${{ github.sha }}
      # The base's Google OAuth client and the alarms' address, from the
      # environment this job runs under: one name in every environment, the
      # environment supplies the value (decision 0020). An environment
      # without them yields empty strings, which the root's variables refuse
      # by name; a root without the variable ignores the TF_VAR.
      TF_VAR_google_client_id: ${{ vars.HEAT_GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.HEAT_GOOGLE_CLIENT_SECRET }}
      TF_VAR_alarm_email: ${{ vars.HEAT_ALARM_EMAIL }}
      ROOT: ${{ matrix.root }}
      STACK: ${{ matrix.stack }}
    steps:
      # The row's account id, a repository secret so that GitHub masks it in
      # every log line, the env echo included (docs/README.md, rule 9; decision
      # 0035). The secrets context is not available in a matrix, so the row
      # cannot carry the id: both secrets are in this step's env and the root
      # chooses, so that the guard reads exactly the value the job will use (an
      # `&& ... ||` expression would fall back to the other secret when the
      # row's is empty). Written to GITHUB_ENV once, for every later step.
      - name: Pick the row's account id, or refuse to run
        env:
          ROOT: ${{ matrix.root }}
          SANDBOX_ACCOUNT_ID: ${{ secrets.HEAT_SANDBOX_ACCOUNT_ID }}
          DEV_ACCOUNT_ID: ${{ secrets.HEAT_DEV_ACCOUNT_ID }}
        run: |
          set -eu
          case "$ROOT" in
            dev) account="$DEV_ACCOUNT_ID"; secret=HEAT_DEV_ACCOUNT_ID ;;
            *)   account="$SANDBOX_ACCOUNT_ID"; secret=HEAT_SANDBOX_ACCOUNT_ID ;;
          esac
          [ -n "$account" ] || { echo "The repository secret $secret is not set." >&2; exit 1; }
          { echo "ACCOUNT_ID=$account"; echo "TF_VAR_workload_account_id=$account"; } >> "$GITHUB_ENV"

      - name: Check out main
        uses: actions/checkout@v7.0.1

      - name: Set up Terraform, pinned and checked
        uses: $/.github/actions/terraform

      - name: Set up Node, pinned and checked
        uses: $/.github/actions/node

      - name: Download the bundles
        if: matrix.code
        uses: actions/download-artifact@v8.0.2
        with:
          name: bundles
          path: dist/

      - name: Download the client
        if: matrix.code
        uses: actions/download-artifact@v8.0.2
        with:
          name: client
          path: client/

      - name: Assume the apply role through GitHub's OIDC provider
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ matrix.role }}
          role-session-name: deploy-apply-${{ matrix.root }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        run: |
          set -eu
          terraform -chdir="terraform/environment/${{ matrix.root }}" init
          terraform -chdir="terraform/environment/${{ matrix.root }}" plan -out "$RUNNER_TEMP/plan.tfplan"

      - name: Check the plan against the resource-type allow-list
        run: |
          set -eu
          terraform -chdir="terraform/environment/${{ matrix.root }}" show -json "$RUNNER_TEMP/plan.tfplan" > "$RUNNER_TEMP/plan.json"
          node scripts/check-plan-resource-types.mjs "$RUNNER_TEMP/plan.json"

      - name: Write the plan to the job summary
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: sh scripts/post-terraform-plan.sh "${{ matrix.root }}" "$RUNNER_TEMP/plan.tfplan" "$GITHUB_SHA" "apply role"

      # Exactly the plan that was checked, not a fresh one.
      - name: Apply
        run: terraform -chdir="terraform/environment/${{ matrix.root }}" apply "$RUNNER_TEMP/plan.tfplan"

      # Test users are data, created after the apply from the committed list
      # beside the root and the environment's secret (decision 0020).
      - name: Create the test users
        if: matrix.test_users
        env:
          TEST_USER_PASSWORD: ${{ secrets.HEAT_TEST_USER_PASSWORD }}
        run: |
          set -eu
          if [ -z "$TEST_USER_PASSWORD" ]; then
            echo "The secret HEAT_TEST_USER_PASSWORD is not set on the ${{ matrix.environment }} environment." >&2
            exit 1
          fi
          pool_id="$(terraform -chdir="terraform/environment/$ROOT" output -raw user_pool_id)"
          sh scripts/create-test-users.sh "$pool_id" "terraform/environment/$ROOT/test-users.txt"

      # From here on, the environment's code: what sandbox.yml does for a
      # per-issue stack after its apply. The content is the apply job's, not
      # Terraform's (terraform/modules/site/README.md, "What is not here").
      - name: Publish the client and config.json to the environment's bucket
        if: matrix.code
        run: |
          set -eu
          out() { terraform -chdir="terraform/environment/$ROOT" output -raw "$1"; }
          sh scripts/publish-client.sh "$(out client_bucket)" client "/graphql" "$(out user_pool_id)" "$(out browser_client_id)" "$(out login_host)" "$(out password_sign_in)" "$(out app_version)"

      - name: Write the environment's URL to the job summary
        id: summary
        if: matrix.code
        run: |
          set -eu
          out() { terraform -chdir="terraform/environment/$ROOT" output -raw "$1"; }
          site_url="$(out site_url)"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Environment \`$STACK\`"
            echo
            echo "Site: $site_url (the page with Sign in with Google, POST /graphql with a Bearer token from the browser client or the ci client, /config.json for the client)."
            echo
            echo "API behind it: \`$(out api_url)\`. Parameters under \`$(out parameter_prefix)\`: site_url, api_url, user_pool_id, app_client_id, browser_client_id, login_host. Alarms notify \`$(out alarm_topic_arn)\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The smoke test (the issue's "one request through the authorizer and
      # the function", grown to the stack test of decision 0018): its own
      # user in the environment's pool, minted with a random password for
      # this run and kept between runs, so no stored secret and no new
      # player record per run.
      - name: Mint the smoke test's user
        if: matrix.code
        run: |
          set -eu
          out() { terraform -chdir="terraform/environment/$ROOT" output -raw "$1"; }
          sh scripts/e2e-user.sh ensure "$(out user_pool_name)" "e2e@$(out zone_name)"

      # What the smoke test needs from AWS, for a job that holds no role
      # (decision 0046). An artifact and not job outputs, because a matrix's
      # outputs are whichever row wrote last.
      - name: Seal what the smoke test needs
        if: matrix.code
        env:
          E2E_HANDOVER_KEY: ${{ secrets.HEAT_E2E_HANDOVER_KEY }}
        run: |
          set -eu
          out() { terraform -chdir="terraform/environment/$ROOT" output -raw "$1"; }
          sh scripts/stack-handover.sh seal "$RUNNER_TEMP/stack-handover/handover.env" "$(out site_url)" "$(out ci_client_id)" "e2e@$(out zone_name)"

      - name: Keep the sealed handover for the smoke test
        if: matrix.code
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stack-handover
          path: ${{ runner.temp }}/stack-handover/handover.env
          if-no-files-found: error
          retention-days: 1

  # dev's smoke test and browser test (decision 0045), one copy with
  # sandbox.yml's. No environment and no id-token permission: this job runs
  # downloaded code (decision 0046). Not skipped when only sandbox-base's row
  # failed; without dev's handover the download fails it. Skipped when the
  # apply never ran, because the build failed, so that failure shows once.
  stack-test:
    name: Test dev
    if: ${{ github.event_name == 'push' && !cancelled() && needs.apply.result != 'skipped' }}
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      since: ${{ steps.test.outputs.since }}
      site_url: ${{ steps.test.outputs.site_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1

      - name: Set up Node, pinned and checked
        uses: $/.github/actions/node

      - name: Test the environment, its API and its page
        id: test
        uses: $/.github/actions/stack-test
        with:
          stack: heat-dev
          handover-key: ${{ secrets.HEAT_E2E_HANDOVER_KEY }}

  # Back under the role, for the function's log, with nothing downloaded. Runs
  # when the smoke test got as far as calling the environment, whatever came
  # after.
  cold-start:
    name: Report dev's cold start
    if: ${{ github.event_name == 'push' && !cancelled() && needs.stack-test.outputs.since != '' }}
    needs: stack-test
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ needs.stack-test.outputs.site_url }}
    permissions:
      contents: read
      id-token: write
    env:
      # A repository secret, so that GitHub masks the id in every log line
      # (docs/README.md, rule 9).
      ACCOUNT_ID: ${{ secrets.HEAT_DEV_ACCOUNT_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1

      - name: Report the cold start
        uses: $/.github/actions/cold-start
        with:
          role-arn: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/heat-dev-apply
          session-name: deploy-cold-start-dev
          log-group: /aws/lambda/heat-dev-hub
          since: ${{ needs.stack-test.outputs.since }}
