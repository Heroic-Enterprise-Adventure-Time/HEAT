# The browser test (decision 0045): the page as a player meets it. Called by
# .github/actions/stack-test, in its job with no role. Expects the repository
# checked out and installed, the engine built, and E2E_PASSWORD, E2E_SITE_URL
# and E2E_CI_CLIENT_ID in the environment.
name: Browser test
description: Uses the stack's page in headless Chromium, and keeps a failed run's trace encrypted.

inputs:
  stack:
    description: The stack under test, named as its parameters are, heat-sb<issue> or heat-dev
    required: true
  username:
    description: The test user's email address
    required: true

runs:
  using: composite
  steps:
    # Installed on every run, not cached: Playwright's CI page, read
    # 2026-11-04, says "Caching browser binaries is not recommended", because a
    # restore takes about as long as a download and Linux's OS dependencies
    # cannot be cached.
    #
    # Not by `playwright install`, which downloads the browser and checks no
    # digest (playwright-core 1.65.1, read 2026-11-27): the archive is pinned
    # by its SHA-256 and checked before it runs (docs/process/best-practices.md,
    # rule 14). Only the headless shell, the browser a headless launch uses;
    # unpacked where Playwright looks, with the marker its own install writes.
    # The checksum was read 2026-11-27 from Playwright's CDN and from Google's
    # chrome-for-testing-public bucket, byte for byte the same; Chrome for
    # Testing publishes no signature. The revision must be the one the locked
    # Playwright names, so a Playwright bump moves these three values with it,
    # the URL read from `npx playwright install --dry-run chromium`.
    - name: Install the headless shell, checked against its pinned checksum
      shell: bash
      env:
        CHROMIUM_REVISION: "1255"
        CHROMIUM_VERSION: 159.0.8154.6
        CHROMIUM_SHA256: 77a6442fd3c8acd3bef9e1067fc26f5ef464277d22f0e8cb58dc3e4077a3e458
      run: |
        set -eu
        if [ "$RUNNER_OS-$RUNNER_ARCH" != Linux-X64 ]; then
          echo "::error::The pinned archive and checksum are linux64; this runner is $RUNNER_OS-$RUNNER_ARCH."
          exit 1
        fi
        locked="$(node -p 'const b = require("./node_modules/playwright-core/browsers.json").browsers.find((x) => x.name === "chromium-headless-shell"); `${b.revision} ${b.browserVersion}`')"
        if [ "$locked" != "$CHROMIUM_REVISION $CHROMIUM_VERSION" ]; then
          echo "::error::The locked Playwright names the headless shell $locked; the pin is $CHROMIUM_REVISION $CHROMIUM_VERSION. Move the pin with Playwright."
          exit 1
        fi
        archive="$RUNNER_TEMP/chrome-headless-shell-linux64.zip"
        curl -fsSL --retry 3 -o "$archive" "https://cdn.playwright.dev/builds/cft/$CHROMIUM_VERSION/linux64/chrome-headless-shell-linux64.zip"
        echo "$CHROMIUM_SHA256  $archive" | sha256sum --check --strict
        target="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}/chromium_headless_shell-$CHROMIUM_REVISION"
        rm -rf "$target"
        mkdir -p "$target"
        unzip -q "$archive" -d "$target"
        touch "$target/INSTALLATION_COMPLETE"
        rm "$archive"

    # The OS packages the browser needs, from the runner's own apt sources,
    # which apt checks against their signed indexes; this downloads no browser.
    - name: Install the headless shell's OS packages
      shell: bash
      run: npx playwright install-deps chromium

    - name: Use the page in a browser as that user
      id: browser
      shell: bash
      env:
        FORCE_COLOR: "0"
        STACK_NAME: ${{ inputs.stack }}
        USERNAME: ${{ inputs.username }}
      run: node scripts/browser-test.mjs --stack "$STACK_NAME" --username "$USERNAME" | tee -a "$RUNNER_TEMP/browser.log"

    - name: Put the browser test's log on the run's page
      if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
      shell: bash
      run: sh scripts/report-browser-test.sh "$RUNNER_TEMP/browser.log" "${{ steps.browser.outcome }}" packages/client/test-results

    # Encrypted before it leaves the runner: a trace holds the test user's
    # password and tokens, and a public repository's artifacts are public.
    - name: Encrypt the browser test's trace
      if: ${{ !cancelled() && steps.browser.outcome == 'failure' }}
      shell: bash
      run: sh scripts/seal-browser-trace.sh packages/client/test-results "$RUNNER_TEMP/browser-trace.tgz.cms"

    - name: Keep the encrypted trace as a run artifact
      if: ${{ !cancelled() && steps.browser.outcome == 'failure' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: browser-trace
        path: ${{ runner.temp }}/browser-trace.tgz.cms
        if-no-files-found: ignore
        retention-days: 7
