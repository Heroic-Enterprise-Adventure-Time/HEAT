# Node for every job, at one exact release whose archive is checked against
# a pinned checksum before it runs (docs/process/best-practices.md,
# rule 14). Every job, not only those that hold a role: the build jobs make
# the bundles the apply jobs deploy. actions/setup-node is not used: when
# the runner's tool cache lacks the version it downloads Node and checks
# nothing, and the image's cache moves to each new patch, so an exact
# version there would download, unchecked, on most runs. Its npm cache goes
# with it; npm ci checks every package against package-lock.json's hashes.
#
# Each checksum is the linux-x64 line of its release's SHASUMS256.txt, whose
# signature was verified when the version was taken, against the release
# keys the nodejs/node README lists (taken from nodejs/release-keys):
# v26.13.1, 2026-11-27, signed by 5BE8A3F6C8A5C01D106C0AD820B1A390B168D356.
# A new version is taken the same way, both values together, in a commit
# of its own (docs/standards/typescript.md, rule 1).
#
# One pin per major, and the one installed is .node-version's, so the
# role-holding jobs stay on the line every other job follows
# (docs/standards/typescript.md, rule 1); a major with no pin is refused.
# Called as $/, so a pull_request_target plan runs the base branch's copy,
# never the pull request's (decision 0047). So a new major's pin lands on
# the base before the pull request that moves .node-version, or that pull
# request's plan finds no pin for it; the old major's pin goes in the
# pull request that moves away from it (decision 0048). Expects the
# repository checked out.
#
# So the pull request that moves .node-version to a new major has no dev
# plan: the base's copy refuses the branch's major. Its sandbox stack's plan
# and apply stand in (decision 0048's amendment of Issue-396).
name: Node
description: Installs the exact Node release pinned for .node-version's major, checked against its pinned checksum.

runs:
  using: composite
  steps:
    - name: Install Node, checked against its pinned checksum
      shell: bash
      env:
        NODE_24_VERSION: 24.22.2
        NODE_24_SHA256: 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75
        NODE_26_VERSION: 26.13.1
        NODE_26_SHA256: 5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864
      run: |
        set -eu
        if [ "$RUNNER_OS-$RUNNER_ARCH" != Linux-X64 ]; then
          echo "::error::The pinned archives and checksums are linux-x64; this runner is $RUNNER_OS-$RUNNER_ARCH."
          exit 1
        fi
        # .node-version as fnm reads it: 26, v26 or 26.13 all name major 26.
        major="$(tr -d '[:space:]' < .node-version)"
        major="${major#v}"
        major="${major%%.*}"
        case "$major" in
          24) version="$NODE_24_VERSION" sha256="$NODE_24_SHA256" ;;
          26) version="$NODE_26_VERSION" sha256="$NODE_26_SHA256" ;;
          *)
            echo "::error::.node-version holds major $major, which this action pins no release for. Its pin lands on the base branch first (decision 0048)."
            exit 1
            ;;
        esac
        archive="node-v${version}-linux-x64.tar.xz"
        curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/v$version/$archive"
        echo "$sha256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/node"
        tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/node" --strip-components 1
        echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/node/bin/node" --version
