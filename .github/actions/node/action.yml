# Node for every job, at one exact release whose archive is checked against
# a pinned checksum before it runs (docs/process/best-practices.md,
# rule 14). Every job, not only those that hold a role: the build jobs make
# the bundles the apply jobs deploy. actions/setup-node is not used: when
# the runner's tool cache lacks the version it downloads Node and checks
# nothing, and the image's cache moves to each new patch, so an exact
# version there would download, unchecked, on most runs. Its npm cache goes
# with it; npm ci checks every package against package-lock.json's hashes.
#
# The checksum is the linux-x64 line of the release's SHASUMS256.txt, whose
# signature was verified when the version was taken, against the release
# keys the nodejs/node README lists (taken from nodejs/release-keys):
# v24.22.2, 2026-11-09, signed by 5BE8A3F6C8A5C01D106C0AD820B1A390B168D356.
# A new version is taken the same way, both values together, in a pull
# request of its own.
#
# The major must be the one .node-version holds, so the role-holding jobs
# stay on the line every other job follows (docs/standards/typescript.md,
# rule 1). Called as $/, so a pull_request_target plan runs the base
# branch's copy, never the pull request's (decision 0047). Expects the
# repository checked out.
name: Node
description: Installs one exact Node release, checked against its pinned checksum, and refuses a major other than .node-version's.

runs:
  using: composite
  steps:
    - name: Install Node, checked against its pinned checksum
      shell: bash
      env:
        NODE_VERSION: 24.22.2
        NODE_SHA256: 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75
      run: |
        set -eu
        if [ "$RUNNER_OS-$RUNNER_ARCH" != Linux-X64 ]; then
          echo "::error::The pinned archive and checksum are linux-x64; this runner is $RUNNER_OS-$RUNNER_ARCH."
          exit 1
        fi
        # .node-version as fnm reads it: 24, v24 or 24.22 all name major 24.
        major="$(tr -d '[:space:]' < .node-version)"
        major="${major#v}"
        major="${major%%.*}"
        if [ "${NODE_VERSION%%.*}" != "$major" ]; then
          echo "::error::The pinned Node $NODE_VERSION is not the major $major that .node-version holds."
          exit 1
        fi
        archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
        curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/v$NODE_VERSION/$archive"
        echo "$NODE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/node"
        tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/node" --strip-components 1
        echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/node/bin/node" --version
