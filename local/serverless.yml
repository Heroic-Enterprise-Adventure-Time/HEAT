# The local emulator's configuration, and nothing else. This file is never
# deployed: Terraform owns the real functions and gateway (decision 0011).
# serverless-offline reads it to run the same handlers behind an emulated
# HTTP API on the laptop (decision 0009). Function and route definitions come
# from manifest.json so that this file and Terraform never disagree.
service: heat-local
frameworkVersion: "4"

plugins:
  - serverless-offline

provider:
  name: aws
  # The Lambda runtime follows the major in .node-version (docs/standards/typescript.md).
  runtime: nodejs24.x
  region: us-east-1
  environment:
    HEAT_TABLE: heat-local
    DYNAMODB_ENDPOINT: http://localhost:8000
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
  httpApi:
    authorizers:
      cognito:
        type: jwt
        # The real heat-dev pool; serverless-offline passes the claims through
        # without validating the signature, which its documentation states.
        identitySource: $request.header.Authorization
        issuerUrl: ${env:HEAT_COGNITO_ISSUER}
        audience:
          - ${env:HEAT_COGNITO_CLIENT_ID}

functions:
  hub:
    handler: ${file(./manifest.json):functions.hub.entry}
    memorySize: ${file(./manifest.json):functions.hub.memoryMb}
    timeout: ${file(./manifest.json):functions.hub.timeoutSeconds}
    events:
      - httpApi:
          method: POST
          path: /graphql
          authorizer:
            name: cognito
      - httpApi:
          method: GET
          path: /graphql
          authorizer:
            name: cognito

custom:
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
    reloadHandler: true
